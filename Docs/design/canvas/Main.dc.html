<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Front Panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@500;800&amp;family=Manrope:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c9cdd2}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{c.bg}}; color: {{c.fg}}; font-family: Manrope, 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; padding: 56px 22px 28px; gap: 20px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: {{c.muted}}">{{skinLabel}} skin</span>
      <span style="font-size: 20px; font-weight: 700; letter-spacing: 0.02em">H590 · Living room</span>
    </div>
    <button aria-label="Power" style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid {{c.line}}; background: {{c.btn}}; color: {{c.accent}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.3 6.8a8 8 0 1 0 11.4 0"></path></svg>
    </button>
  </div>

  <div style="background: {{c.readoutBg}}; border-radius: 12px; border: 1px solid {{c.line}}; padding: 18px; display: flex; justify-content: space-between; align-items: flex-end">
    <span style="font-family: Doto, 'Courier New', monospace; font-weight: 800; font-size: 26px; color: {{c.readoutFg}}; letter-spacing: 0.04em">NETWORK</span>
    <span style="font-family: Doto, 'Courier New', monospace; font-weight: 800; font-size: 64px; line-height: 0.85; color: {{c.readoutFg}}">33</span>
  </div>

  <sc-if value="{{isWheel}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; justify-content: center; padding: 6px 0">
      <div style="width: 264px; height: 264px; border-radius: 132px; background: {{c.wheel}}; border: 1px solid {{c.line}}; position: relative; display: flex; align-items: center; justify-content: center">
        <span style="position: absolute; top: 18px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.16em; color: {{c.muted}}">MUTE</span>
        <span style="position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.16em; color: {{c.muted}}">INPUT</span>
        <span style="position: absolute; left: 22px; top: 118px; font-size: 24px; font-weight: 700; color: {{c.muted}}">−</span>
        <span style="position: absolute; right: 22px; top: 118px; font-size: 24px; font-weight: 700; color: {{c.muted}}">+</span>
        <button aria-label="Show volume" style="width: 104px; height: 104px; border-radius: 52px; border: 1px solid {{c.line}}; background: {{c.center}}; color: {{c.fg}}; font: 700 13px Manrope, sans-serif; letter-spacing: 0.1em">33</button>
      </div>
    </div>
    <p style="margin: 0; text-align: center; font-size: 13px; color: {{c.muted}}">Circle the ring to change volume · one detent = 1 step</p>
  </sc-if>

  <sc-if value="{{isSlider}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 18px 0 8px">
      <label for="vol" style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: {{c.muted}}">Volume</label>
      <div style="height: 56px; border-radius: 28px; background: {{c.wheel}}; border: 1px solid {{c.line}}; display: flex; align-items: center; padding: 0 6px">
        <div style="width: 33%; height: 44px; border-radius: 22px; background: {{c.accent}}; display: flex; justify-content: flex-end; align-items: center">
          <div style="width: 44px; height: 44px; border-radius: 22px; background: {{c.fg}}"></div>
        </div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: {{c.muted}}"><span>0</span><span>Night limit 60</span><span>99</span></div>
    </div>
    <div style="display: flex; gap: 10px">
      <button style="flex: 1; height: 52px; border-radius: 14px; border: 1px solid {{c.line}}; background: {{c.btn}}; color: {{c.fg}}; font: 600 15px Manrope, sans-serif">Vol −</button>
      <button style="flex: 1; height: 52px; border-radius: 14px; border: 1px solid {{c.line}}; background: {{c.btn}}; color: {{c.fg}}; font: 600 15px Manrope, sans-serif">Mute</button>
      <button style="flex: 1; height: 52px; border-radius: 14px; border: 1px solid {{c.line}}; background: {{c.btn}}; color: {{c.fg}}; font: 600 15px Manrope, sans-serif">Vol +</button>
    </div>
  </sc-if>

  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto">
    <span style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: {{c.muted}}">Inputs</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button style="height: 44px; border-radius: 12px; border: 1px solid {{c.accent}}; background: {{c.btn}}; color: {{c.fg}}; font: 700 14px Manrope, sans-serif">Network</button>
      <button style="height: 44px; border-radius: 12px; border: 1px solid {{c.line}}; background: {{c.btn}}; color: {{c.muted}}; font: 600 14px Manrope, sans-serif">Pontus</button>
      <button style="height: 44px; border-radius: 12px; border: 1px solid {{c.line}}; background: {{c.btn}}; color: {{c.muted}}; font: 600 14px Manrope, sans-serif">USB</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"skin":{"editor":"enum","options":["black","silver","oled"],"default":"black"},"control":{"editor":"enum","options":["wheel","slider"],"default":"wheel"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const skins = {
black:  { label: 'Black',  bg: '#0c0d0e', fg: '#e8eaec', muted: '#959aa0', line: '#2f3337', btn: '#16181a', accent: '#d9a441', readoutBg: '#000000', readoutFg: '#f4f6f8', wheel: '#17191c', center: '#0c0d0e' },
silver: { label: 'Silver', bg: '#e9eaeb', fg: '#141516', muted: '#55595e', line: '#b4b7bb', btn: '#f5f6f7', accent: '#141516', readoutBg: '#111213', readoutFg: '#f4f6f8', wheel: '#f7f8f9', center: '#d4d6d9' },
oled:   { label: 'OLED',   bg: '#000000', fg: '#f4f6f8', muted: '#8a9096', line: '#26292c', btn: '#000000', accent: '#f4f6f8', readoutBg: '#000000', readoutFg: '#f4f6f8', wheel: '#0b0b0c', center: '#000000' }
};
const key = this.props.skin ?? 'black';
const c = skins[key] ?? skins.black;
const control = this.props.control ?? 'wheel';
return { c: c, skinLabel: c.label, isWheel: control === 'wheel', isSlider: control === 'slider' };
}
}
</script>
</body>
</html>
