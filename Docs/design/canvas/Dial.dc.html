<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Single Dial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@500;800&amp;family=Manrope:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c9cdd2}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{c.bg}}; color: {{c.fg}}; font-family: Manrope, 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; padding: 56px 22px 28px; gap: 16px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: {{c.muted}}">{{skinLabel}}</span>
      <span style="font-size: 20px; font-weight: 700">H590</span>
    </div>
    <div style="display: flex; gap: 10px">
      <button aria-label="Mute" style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid {{c.line}}; background: {{c.btn}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M17 9l4 6"></path><path d="M21 9l-4 6"></path></svg>
      </button>
      <button aria-label="Power" style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid {{c.line}}; background: {{c.btn}}; color: {{c.accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.3 6.8a8 8 0 1 0 11.4 0"></path></svg>
      </button>
    </div>
  </div>

  <div style="display: flex; justify-content: center; padding: 4px 0">
    <div style="width: 276px; height: 276px; border-radius: 138px; background: {{c.ring}}; border: 1px solid {{c.line}}; box-shadow: 0 16px 36px {{c.shadow}}; display: flex; align-items: center; justify-content: center">
      <div style="width: 180px; height: 180px; border-radius: 90px; background: {{c.readoutBg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
        <span style="font-family: Doto, 'Courier New', monospace; font-weight: 800; font-size: 78px; line-height: 0.9; color: {{c.readoutFg}}">39</span>
        <span style="font-family: Doto, 'Courier New', monospace; font-weight: 800; font-size: 15px; letter-spacing: 0.12em; color: {{c.readoutFg}}">NETWORK</span>
      </div>
    </div>
  </div>

  <div style="display: flex; justify-content: center; gap: 18px">
    <button aria-label="Previous track" style="width: 56px; height: 56px; border-radius: 28px; border: 1px solid {{c.line}}; background: {{c.btn}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14"></path><path d="M19 5l-10 7 10 7z"></path></svg>
    </button>
    <button aria-label="Play or pause" style="width: 56px; height: 56px; border-radius: 28px; border: 1px solid {{c.fg}}; background: {{c.fg}}; color: {{c.bg}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5l10 7-10 7z"></path></svg>
    </button>
    <button aria-label="Next track" style="width: 56px; height: 56px; border-radius: 28px; border: 1px solid {{c.line}}; background: {{c.btn}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 5v14"></path><path d="M5 5l10 7-10 7z"></path></svg>
    </button>
  </div>
  <p style="margin: 0; text-align: center; font-size: 12px; color: {{c.muted}}">Playback via Plexamp (mapped to XLR 1)</p>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: {{c.muted}}">Inputs</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button style="height: 44px; border-radius: 22px; border: 1px solid {{c.fg}}; background: {{c.fg}}; color: {{c.bg}}; font: 700 14px Manrope, sans-serif">Network</button>
      <button style="height: 44px; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.btn}}; color: {{c.fg}}; font: 600 14px Manrope, sans-serif">Pontus</button>
      <button style="height: 44px; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.btn}}; color: {{c.fg}}; font: 600 14px Manrope, sans-serif">USB</button>
      <button style="height: 44px; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.btn}}; color: {{c.fg}}; font: 600 14px Manrope, sans-serif">Optical 1</button>
      <button style="height: 44px; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.btn}}; color: {{c.fg}}; font: 600 14px Manrope, sans-serif">TV</button>
      <button style="height: 44px; border-radius: 22px; border: 1px dashed {{c.line}}; background: transparent; color: {{c.muted}}; font: 600 14px Manrope, sans-serif">Edit</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: {{c.muted}}">Custom</span>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid {{c.line}}; background: {{c.btn}}; color: {{c.fg}}; font: 600 14px Manrope, sans-serif">Late night · Net 25</button>
      <button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid {{c.line}}; background: {{c.btn}}; color: {{c.fg}}; font: 600 14px Manrope, sans-serif">Pontus · 40</button>
      <button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px dashed {{c.line}}; background: transparent; color: {{c.muted}}; font: 600 14px Manrope, sans-serif">+ Add</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"skin":{"editor":"enum","options":["silver","black","oled"],"default":"silver"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const skins = {
silver: { label: 'Silver', bg: '#e9eaeb', fg: '#141516', muted: '#55595e', line: '#b4b7bb', btn: '#f5f6f7', accent: '#141516', readoutBg: '#111213', readoutFg: '#f4f6f8', ring: 'radial-gradient(circle at 35% 28%, #ffffff 0%, #d4d6d9 55%, #a9acb0 100%)', shadow: '#9ea2a6' },
black:  { label: 'Black',  bg: '#0c0d0e', fg: '#e8eaec', muted: '#959aa0', line: '#2f3337', btn: '#16181a', accent: '#d9a441', readoutBg: '#000000', readoutFg: '#f4f6f8', ring: 'radial-gradient(circle at 35% 28%, #4a4e54 0%, #2a2d31 50%, #16181a 100%)', shadow: '#000000' },
oled:   { label: 'OLED',   bg: '#000000', fg: '#f4f6f8', muted: '#8a9096', line: '#26292c', btn: '#000000', accent: '#f4f6f8', readoutBg: '#000000', readoutFg: '#f4f6f8', ring: '#0b0b0c', shadow: '#000000' }
};
const c = skins[this.props.skin ?? 'silver'] ?? skins.silver;
return { c: c, skinLabel: c.label };
}
}
</script>
</body>
</html>
